# logging.level.org.springframework.cloud.gateway: trace

server:
  port: 8282

spring:
  application:
    name: gateway
  cloud:
    loadbalancer:
      cache:
        ttl: 30s
    gateway:
      server:
        webflux:
          route-filter-cache-enabled: true
          predicate:
            cloud-foundry-route-service:
              enabled: false
          httpclient:
            connect-timeout: 1000
            response-timeout: 5s
          routes:
            - uri: http://localhost:8762
              predicates:
                - Path=/foo
